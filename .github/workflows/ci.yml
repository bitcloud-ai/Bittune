name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BITTUNE_CORE_PYTHON: python
      BITTUNE_TEST_PYTHON: python
      BITTUNE_PYTHON: python
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python Core
        run: python -m pip install ./packages/bittune-core
      - name: Type check
        run: npm run check
      - name: Verify managed parameter descriptors
        run: npm run check:managed-contract
      - name: Verify suite contract
        run: node scripts/check-suite-contract.mjs
      - name: Run Python Core tests
        run: npm run test:python
      - name: Run Runtime tests
        run: npm test
      - name: Verify release boundary
        run: npm run check:release-boundary
