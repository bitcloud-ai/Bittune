name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python Core
        run: python -m pip install ./packages/bittune-core

      - name: Check and package installer
        run: npm run package:agent
        env:
          BITTUNE_CORE_PYTHON: python
          BITTUNE_TEST_PYTHON: python
          BITTUNE_PYTHON: python

      - name: Validate installer entrypoints
        run: |
          bash -n install/bootstrap.sh
          bash -n install/build-offline-bundle.sh
          tar -tzf release/bittune-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz >/dev/null
          tar -tzf release/bittune-${GITHUB_REF_NAME#v}-linux-x86_64-offline.tar.gz >/dev/null
          test ! -e release/bittune-runtime-${GITHUB_REF_NAME#v}.tgz

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
            release/*-sbom.cdx.json
