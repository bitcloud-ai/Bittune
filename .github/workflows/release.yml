name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify tag version
        run: npm run check:release-version

      - name: Package installer
        run: npm run package:agent

      - name: Validate installer entrypoints
        run: |
          bash -n install/bootstrap.sh
          bash -n install/build-offline-bundle.sh
          tar -tzf release/bittune-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz >/dev/null
          tar -tzf release/bittune-${GITHUB_REF_NAME#v}-linux-x86_64-offline.tar.gz >/dev/null
          test ! -e release/bittune-runtime-${GITHUB_REF_NAME#v}.tgz

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb4c170d6b0e3eaaf984254 # v2.2.1
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
            release/*-sbom.cdx.json
